name: Checks and release

on:
  pull_request:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check module consistency
        run: go mod tidy -diff

      - name: Test with race detection
        run: go test -race ./...
        env:
          # The form library switches to accessible mode for TERM=dumb.
          TERM: xterm-256color

      - name: Vet
        run: go vet ./...

      - name: Check vulnerabilities
        run: make govulncheck

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --snapshot --clean

      - name: Smoke test release binary
        run: ./dist/qobuz-kit_linux_amd64_v1/qobuz-kit --help

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
