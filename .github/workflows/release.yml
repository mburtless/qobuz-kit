name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...
        env:
          # The form library switches to accessible mode for TERM=dumb.
          TERM: xterm-256color

      - name: Vet
        run: go vet ./...

      - name: Check vulnerabilities
        run: make govulncheck

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
